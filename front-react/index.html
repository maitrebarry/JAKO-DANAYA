<!doctype html>
<html lang="en" data-bs-theme="light" data-sidenav-color="light" data-layout-position="fixed" data-topbar-color="light" data-sidenav-size="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Runtime config loader: place a file /app-config.js or set window.APP_CONFIG in hosting environment to override API base at runtime -->
    <script>
      (function(){
        try {
          // If a global APP_CONFIG is injected by the host (Render static site), keep it.
          if (window.APP_CONFIG) return;
          // Load /app-config.js synchronously to ensure it's available before modules load
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/app-config.js', false); // synchronous
          xhr.send();
          if (xhr.status === 200) {
            eval(xhr.responseText); // execute the script
          }
        } catch(e) { /* ignore */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/vendor.min.css" />
    <link rel="stylesheet" href="/css/app.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css">
    <title>JÀGO DÁNAYA</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
