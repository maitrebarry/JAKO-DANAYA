server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve static files, but fall back to index.html for SPA routes.
  # index.html référence les bundles par nom haché : il ne doit jamais être mis
  # en cache par le navigateur, sinon un déploiement peut rester invisible.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Bundles JS/CSS Vite : nom haché sur le contenu, donc cache long et sûr.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Optional proxy for API requests when frontend uses relative /api path
  location /api/ {
    proxy_pass http://backend:8085/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Improve security defaults (basic)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
}
