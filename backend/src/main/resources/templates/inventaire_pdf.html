<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <th:block th:replace="fragments/receipt_style :: styles"></th:block>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'">
    <!-- background fills the header area -->
</div>
<div th:if="${logoBase64 == null}" class="header">
    <div class="no-logo-info">
        <div><strong th:text="${boutiqueNom}"></strong></div>
        <div><span th:text="${boutiqueTelephone}"></span></div>
        <div><span th:text="${boutiqueAdresse}"></span></div>
    </div>
</div>

<div class="doc-title-wrap">
    <span class="title-line"></span><span class="title-dot"></span>
    <span class="doc-title-text">INVENTAIRE</span>
    <span class="title-dot"></span><span class="title-line"></span>
</div>

<table class="parties-row">
    <tr>
    <td class="party-box">
        <span class="party-label">Boutique : </span>
        <span class="party-name" th:text="${boutiqueNom}"></span>
    </td>
    <td class="party-box">
        <span class="party-label">Réalisé par : </span>
        <span class="party-name" th:text="${par}"></span>
    </td>
    <td class="party-box">
        <span class="party-label">Réf : </span><span th:text="${reference}"></span><br/>
        <span class="party-label">Date : </span><span th:text="${dateInventaireFormatted != null ? dateInventaireFormatted : (inventaire != null and inventaire.dateInventaire != null ? inventaire.dateInventaire : '')}"></span>
    </td>
    </tr>
</table>

<table class="doc-table">
    <colgroup>
        <col class="num-col" /><col /><col /><col /><col />
    </colgroup>
    <thead>
    <tr>
        <th>N°</th>
        <th class="left">Produit</th>
        <th>Quantité physique</th>
        <th>Écart</th>
        <th>Montant</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="li, liStat : ${lignes}">
        <td th:text="${liStat.count}"></td>
        <td class="left" th:text="${li.produit != null ? (li.produit.nomProduit != null ? li.produit.nomProduit : li.produit.nom) : '-'}"></td>
        <td>
            <span th:text="${li.quantitePhysique != null ? #numbers.formatInteger(li.quantitePhysique,0) : 0}"></span>
            <span th:text="${li.produit != null and li.produit.unite != null ? li.produit.unite.libelle : 'u'}"></span>
            <br th:if="${li.produit != null and li.produit.nombreUnitesParConditionnement != null and li.produit.nombreUnitesParConditionnement > 0}"/>
            <small th:if="${li.produit != null and li.produit.nombreUnitesParConditionnement != null and li.produit.nombreUnitesParConditionnement > 0}">
                (≈ <span th:text="${#numbers.formatInteger((li.quantitePhysique != null ? li.quantitePhysique : 0) / li.produit.nombreUnitesParConditionnement,0)}">0</span>
                <span th:text="${li.produit.uniteConditionnement != null and !#strings.isEmpty(li.produit.uniteConditionnement) ? li.produit.uniteConditionnement : (li.produit.unite != null ? li.produit.unite.libelle : 'carton')}"></span>)
            </small>
        </td>
        <td th:text="${li.ecartStock != null ? li.ecartStock : '-'}"></td>
        <td th:text="${li.montant != null ? #numbers.formatInteger(li.montant, 0) + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA') : '-'}"></td>
    </tr>
    </tbody>
</table>

<table class="total-banner">
    <tr>
        <td class="tb-accent"><div class="tb-cart"></div></td>
        <td class="tb-label">Total :</td>
        <td class="tb-value" th:text="${montantTotalLabel}">0</td>
    </tr>
</table>

<div class="signatures-heading">Signature</div>
<table class="sign-row">
    <tr>
    <td class="sign-col">
        <div class="sign-label">Signature :</div>
        <span th:if="${signatureBase64 != null}"><img th:src="${signatureBase64}" style="height:48px;" /></span>
        <span th:if="${signatureBase64 == null}">__________________________</span>
    </td>
    <td class="sign-stamp-col">
        <img th:if="${cachetBase64 != null}" th:src="${cachetBase64}" style="height:72px;max-width:140px;" />
    </td>
    <td class="sign-col right-col"></td>
    </tr>
</table>

<div class="thanks-banner">La satisfaction de nos clients, notre priorité !</div>
</body>
</html>
