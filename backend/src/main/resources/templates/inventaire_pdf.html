<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <style>
        body { font-family: 'Helvetica', Arial, sans-serif; color: #2b2b2b; margin: 16px; }
        .header { width: 100%; height: 120px; margin-bottom: 8px; border: none; padding: 0; box-sizing: border-box; position: relative; }
        .header.bg-logo { background-size: cover; background-position: center; background-repeat: no-repeat; }
        .logo { display:block; width:100%; max-height: 110px; height:auto; }
        .no-logo-info { display:block; text-align:center; height: 100%; font-size: 16px; font-weight: bold; color: #2b2b2b; line-height: 1.5; background:#f6f6f6; padding: 14px; box-sizing:border-box; }
        .footer-info { width:100%; overflow:hidden; margin-bottom: 16px; }
        .boutique-info { float:left; width:50%; font-size: 12px; line-height:1.4; }
        .meta-info { float:right; width:48%; text-align: right; font-size: 12px; line-height:1.4; }
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; border: 1px solid #ddd; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px 10px; vertical-align: middle; text-align: left; }
        .table td.right, .table th.right { text-align: right; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .meta { margin-bottom: 4px; }
        .title { text-align:center; font-size: 20px; font-weight: 800; padding: 8px; color: #222; }
        .table tbody tr:nth-child(even) { background: #fbfbfb; }
        .right { text-align:right; }
        .total-row { font-weight:700; font-size: 13px; }
        .signature { margin-top: 28px; font-size: 12px; }
        footer { margin-top: 20px; font-size: 11px; color: #666; text-align: center; }
  </style>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'">
    <!-- background fills the header area -->
</div>
<div th:if="${logoBase64 == null}" class="header">
    <div class="no-logo-info">
        <div><strong th:text="${inventaire.boutique != null ? inventaire.boutique.nom : ''}"></strong></div>
        <div><span th:text="${inventaire.boutique != null ? inventaire.boutique.telephone : ''}"></span></div>
        <div><span th:text="${inventaire.boutique != null ? inventaire.boutique.adresse : ''}"></span></div>
    </div>
</div>
<div class="footer-info">
    <div th:if="${logoBase64 == null}" class="boutique-info">
        <div><strong th:text="${inventaire.boutique != null ? inventaire.boutique.nom : ''}"></strong></div>
        <div><span th:text="${inventaire.boutique != null ? inventaire.boutique.telephone : ''}"></span></div>
        <div><span th:text="${inventaire.boutique != null ? inventaire.boutique.adresse : ''}"></span></div>
    </div>
    <div class="meta-info">
        <div class="meta">Réf: <span th:text="${reference}"></span></div>
        <div class="meta">Date: <span th:text="${dateInventaireFormatted != null ? dateInventaireFormatted : (inventaire.dateInventaire != null ? inventaire.dateInventaire : '')}"></span></div>
        <div class="meta">Par: <span th:text="${par}"></span></div>
    </div>
</div>
<div class="title">INVENTAIRE</div>


  <table class="table">
    <thead>
      <tr>
        <th>Produit</th>
        <th>Quantité physique</th>
        <th>Ecart</th>
        <th class="right">Montant</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="li : ${lignes}">
        <td class="product" th:text="${li.produit != null ? (li.produit.nomProduit != null ? li.produit.nomProduit : li.produit.nom) : '-'}"></td>
        <td>
            <span th:text="${li.quantitePhysique != null ? #numbers.formatInteger(li.quantitePhysique,0) : 0}"></span>
            <span th:text="${li.produit != null && li.produit.unite != null ? li.produit.unite.libelle : 'u'}"></span>
            <br th:if="${li.produit != null and li.produit.nombreUnitesParConditionnement != null and li.produit.nombreUnitesParConditionnement > 0}"/>
            <small th:if="${li.produit != null and li.produit.nombreUnitesParConditionnement != null and li.produit.nombreUnitesParConditionnement > 0}">
                (≈ <span th:text="${#numbers.formatInteger((li.quantitePhysique != null ? li.quantitePhysique : 0) / li.produit.nombreUnitesParConditionnement,0)}">0</span>
                <span th:text="${li.produit.unite != null ? li.produit.unite.libelle : 'carton'}"></span>)
            </small>
        </td>
        <td th:text="${li.ecartStock != null ? li.ecartStock : '-'}"></td>
        <td class="right" th:text="${li.montant != null ? #numbers.formatInteger(li.montant, 0) + ' FCFA' : '-'}"></td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3" class="right total-row">TOTAL</td>
        <td class="right total-row" th:text="${#numbers.formatInteger(montantTotal != null ? montantTotal : 0, 0)} + ' FCFA'">0</td>
      </tr>
    </tfoot>
  </table>
  
  <div class="signature">Signature: __________________________</div>
  <footer>Merci d'avoir choisi notre boutique. Pour toute réclamation, contactez-nous au <span th:text="${inventaire.boutique != null ? inventaire.boutique.telephone : ''}"></span>.</footer>

</body>
</html>
