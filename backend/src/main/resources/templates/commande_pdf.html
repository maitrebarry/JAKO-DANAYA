<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commande Fournisseur</title>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; color: #2b2b2b; margin: 16px; }
        /* Header: no visible border, logo fills area via background-image when available */
        .header { width: 100%; height: 120px; margin-bottom: 8px; border: none; padding: 0; box-sizing: border-box; position: relative; }
        .header.bg-logo { background-size: cover; background-position: center; background-repeat: no-repeat; }
        /* Make logo fill the header rectangle when used as img fallback */
        .logo { display:block; width:100%; max-height: 110px; height:auto; }
        /* No-logo block: give it a filled rectangle look */
        .no-logo-info { display:block; text-align:center; height: 100%; font-size: 16px; font-weight: bold; color: #2b2b2b; line-height: 1.5; background:#f6f6f6; padding: 14px; box-sizing:border-box; }
        /* Simple two-column footer layout using floats for better PDF compatibility */
        .footer-info { width:100%; overflow:hidden; margin-bottom: 16px; }
        .boutique-info { float:left; width:50%; font-size: 12px; line-height:1.4; }
        .meta-info { float:right; width:48%; text-align: right; font-size: 12px; line-height:1.4; }
        /* Table grid: full borders and centered content */
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px 10px; text-align:center; vertical-align: middle; }
        .table .right { text-align:center; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .meta { margin-bottom: 4px; }
        .title { text-align:center; font-size: 20px; font-weight: 800; padding: 8px; color: #222; }
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .table th, .table td { border-bottom: 1px solid #ddd; padding: 8px 10px; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .table tbody tr:nth-child(even) { background: #fbfbfb; }
        .right { text-align:right; }
        .total-row { font-weight:700; font-size: 13px; }
        .signature { margin-top: 28px; font-size: 12px; }
        footer { margin-top: 20px; font-size: 11px; color: #666; text-align: center; }
    </style>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'">
    <!-- background fills the header area -->
</div>
<div th:if="${logoBase64 == null}" class="header">
    <div class="no-logo-info">
        <div><strong th:text="${commande.boutique != null ? commande.boutique.nom : ''}"></strong></div>
        <div><span th:text="${commande.boutique != null ? commande.boutique.telephone : ''}"></span></div>
        <div><span th:text="${commande.boutique != null ? commande.boutique.adresse : ''}"></span></div>
    </div>
</div>
<div class="footer-info">
    <div th:if="${logoBase64 == null}" class="boutique-info">
        <div><strong th:text="${commande.boutique != null ? commande.boutique.nom : ''}"></strong></div>
        <div><span th:text="${commande.boutique != null ? commande.boutique.telephone : ''}"></span></div>
        <div><span th:text="${commande.boutique != null ? commande.boutique.adresse : ''}"></span></div>
    </div>
    <div class="meta-info">
        <div class="meta">Réf: <span th:text="${commande.reference}"></span></div>
        <div class="meta">Date: <span th:text="${dateCommandeFormatted}"></span></div>
        <div class="meta">Par: <span th:text="${commande.utilisateur != null ? commande.utilisateur.nom + ' ' + commande.utilisateur.prenom : ''}"></span></div>
    </div>
</div>
<div class="title">FACTURE DE COMMANDE</div>

<table class="table">
    <thead>
    <tr>
        <th>Désignation</th>
        <th class="right">Quantité</th>
        <th class="right">Prix</th>
        <th class="right">Montant</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ligne : ${commande.lignes}">
        <td th:text="${ligne.stock != null && ligne.stock.produit != null ? ligne.stock.produit.nomProduit : 'Produit'}"></td>
        <td class="right" th:text="${ligne.quantite != null ? #numbers.formatInteger(ligne.quantite, 0) : '0'}"></td>
        <td class="right" th:text="${ligne.newPrice != null ? #numbers.formatInteger(ligne.newPrice, 0) : (ligne.stock != null && ligne.stock.produit != null ? #numbers.formatInteger(ligne.stock.produit.prixAchat, 0) : '0')} + ' FCFA'"></td>
        <td class="right" th:text="${#numbers.formatInteger((ligne.newPrice != null ? ligne.newPrice : (ligne.stock != null && ligne.stock.produit != null ? ligne.stock.produit.prixAchat : 0)) * (ligne.quantite != null ? ligne.quantite : 0), 0)} + ' FCFA'"></td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td colspan="3" class="right total-row">TOTAL</td>
        <td class="right total-row" th:text="${#numbers.formatInteger(commande.total != null ? commande.total : 0, 0)} + ' FCFA'">0</td>
    </tr>
    </tfoot>
</table>

<div class="signature">Signature: __________________________</div>
<footer>Merci d'avoir choisi notre boutique. Pour toute réclamation, contactez-nous au <span th:text="${commande.boutique != null ? commande.boutique.telephone : ''}"></span>.</footer>
</body>
</html>
