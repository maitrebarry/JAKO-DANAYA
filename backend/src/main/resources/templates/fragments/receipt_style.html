<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="styles">
<style>
    /* Style de reçu/facture partagé par tous les documents PDF de l'application.
       Un seul endroit à modifier pour que commande, réception, livraison, paiement,
       caisse, dépense, vente, inventaire et rapports restent visuellement cohérents. */
    body { font-family: sans-serif; color: #20242c; margin: 16px; }

    /* -- En-tête (logo boutique) : classes historiques, conservées telles quelles -- */
    .header { width: 100%; height: 160px; margin-bottom: 12px; border: none; padding: 0; box-sizing: border-box; position: relative; }
    .header.bg-logo { background-size: cover; background-position: center; background-repeat: no-repeat; }
    .logo { display:block; width:100%; max-height: 150px; height:auto; }
    .no-logo-info { display:block; text-align:center; height: 100%; font-size: 16px; font-weight: bold; color: #2b2b2b; line-height: 1.5; background:#f6f6f6; padding: 14px; box-sizing:border-box; }

    /* -- Titre du document, encadré de deux traits et pastilles (façon modèle Ganame) -- */
    .doc-title-wrap { text-align: center; margin: 10px 0 18px 0; white-space: nowrap; }
    .doc-title-wrap .title-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
        background:#154c96; vertical-align:middle; }
    .doc-title-wrap .title-line { display:inline-block; width: 54px; height: 2px; background:#154c96; vertical-align:middle; }
    .doc-title-wrap .doc-title-text { display:inline-block; white-space:nowrap; font-size: 22px; font-weight: 800;
        color:#123a73; letter-spacing: 1px; text-transform: uppercase; vertical-align:middle; margin: 0 10px; }

    /* -- Ligne des parties (Fournisseur / Client / Réf+Date), en bandeau sans fond, séparé par des filets.
       En vrai tableau (pas des divs flottantes) : les éléments flottants se coupent mal sur un saut de
       page dans ce moteur PDF, un tableau bascule proprement à la page suivante si besoin. -- */
    .parties-row { width:100%; margin-bottom: 18px; border-top:1px solid #c9dcf5;
        border-bottom:1px solid #c9dcf5; border-collapse:collapse; page-break-inside: avoid; }
    .party-box { box-sizing:border-box; padding: 10px 14px; font-size:12px; line-height:1.6;
        border-left: 1px solid #dce7f7; vertical-align:top; }
    .party-box:first-child { border-left: none; }
    .party-box .party-label { font-weight:800; color:#20242c; }
    .party-box .party-name { font-weight:800; color:#154c96; }

    /* -- Tableau des lignes -- */
    .doc-table { width:100%; border-collapse: collapse; margin-top: 4px; font-size: 12px; border: 1px solid #c9dcf5; }
    .doc-table thead th { background:#154c96; color:#fff; font-weight:700; text-transform:uppercase;
        font-size: 11.5px; padding: 9px 10px; text-align:center; border:1px solid #154c96; }
    .doc-table tbody td { padding: 8px 10px; border: 1px solid #dce7f7; text-align:center; vertical-align:middle; }
    .doc-table tbody tr:nth-child(even) { background:#eef4fd; }
    .doc-table .left { text-align:left; }
    .doc-table .right { text-align:right; }
    .doc-table .num-col { width: 34px; }

    /* -- Bannière total / montant : 3 segments façon modèle (accent | libellé | valeur) -- */
    .total-banner { width:100%; margin-top:12px; border:1px solid #154c96; border-radius:4px;
        border-collapse:collapse; overflow:hidden; }
    .total-banner td { padding: 10px 16px; box-sizing:border-box; vertical-align:middle; }
    .total-banner .tb-accent { width:44px; text-align:center; border-right:1px solid #c9dcf5; }
    /* Icône panier : image réelle (PNG), pas un emoji — ce moteur PDF n'a pas de police couleur
       et n'affiche aucun emoji (rendu en "#"). Image intégrée directement (pas de fichier externe :
       openhtmltopdf convertit le HTML sans URL de base, seules les data URI sont garanties de marcher). */

        background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAAAELklEQVR4nO3c63UbRwwGUNjHLaSrVOKCUkm6ShHxHyvRg4J4yNldAHNvATo0Zj8AO5IZAQAAAAAAAAAAAAAAAAAAAAAAAEBp31b/wD/+/Ovf1T/zln/+/rn8s8N736/+AFCZgEBCQCAhIJAQEEj8WPFDzrq5grM9HBChYAdWLEg8HBC/qGMHJggkngqIKcJ0S26xHiFcdGDFgsTTATEJmOyyCeL3KHSwJCCmCFNd+g5iilCdl3RILAuINYuJLp8g1iwqWxoQU4RpLp8gEaYIdZUICFR1yEpUaSJY+3jG+IAw29EN8JAVS9dmCu8gkBAQSBwWEGsWE5ggkDi8y7+/0XqZLG66WO2IreWU/5Nu3eIMr5vuqmfu8BVLOOjMOwjjrGzKAgKJUeuPF38i1k6Qy744rgLvR7U90vBWn+nWK5aJw1e2Dgh1VWleowJiZdrbEec/KiCwmoBQTpX1KkJAGOKo9Xr7gFTqVtSzfUCopVrDGhcQN1n7OfLMxwUEVhIQyqi2XkUICM21/F6sbip2LmoQEEqo2qRGBsRN1h7OOOeRAYFVBITLVV2vIgTkP5UPiY/OWqMFBBJjA+JFvYfqk3tsQJjrzOYnIJAQEC5Tfb2KEJA3OhzY7s5+txQQSIwOiJusurpM69EBYZYrGp6AQEJAOF2X9SpCQD7odHg7uep9UkAgMT4gbrJq6TahxweE/q5scgICCQHhNN3WqwgBuanjQU519TukgEBii4Bc3YXoO5W3CAg9VWhsAgIJAeFwXderCAH5VOdDnaDCehUhIJDaJiBVOtJuuk/ibQJCH5WamYBAQkAS3deDq02on4BQSqX1KmKzgFQrPvVtFRDOM2G9ihAQCqk44QUEEgLyhSmrwpkm1UxAKKHiehWxYUCqHgQ1bRcQjjVpvYoQEAqoPNUFBBICcodpa8NRJtZJQLhU5fUqYtOAVD8U6tgyIKw3cb2KiNi2k0490E46THITBBICAgkB4RId1quIjQPS5YC41rYBgXv8uPoDXO39JHG7tc5Lbd/XtNP03jognQ6qs9d17taArFicqltTEhBICAgkBASAx7R6YbpKdvPS7aXzGTvWYeQ/aoVHriMnPiS718E7yA2P3tV3u+P/ijqYIG+sPNjOXVQd/meC/La663XtourwloDEcYfY7eFQh48EBBLbB+To7tale6rDbVsH5KxDq/5wqMPntg4IfEVAILFtQM4e91XXC3XIbRsQuIeAQEJAICEgkBAQSAgIJLYNyNl/hl31z77VIbdtQOAeAgKJrQNy1rivvlaow+e2DkjE8YfW5aFQh9u2DwhkBCSO627duqY6fCQgv60+xK4PhTq81frDH+WZP8nu/kC8pg4myE2PHu6Uh+KFOpggd9nxO2lvUQcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOMkvrSJnm9IwUEMAAAAASUVORK5CYII=);
        background-size:contain; background-repeat:no-repeat; background-position:center; }
    .total-banner .tb-label { font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:0.5px; color:#123a73; white-space:nowrap; }
    .total-banner .tb-value { background:#154c96; color:#fff; font-weight:800; font-size:16px; text-align:right; white-space:nowrap; }

    /* -- Encadrés d'informations détaillées (client / fournisseur / boutique).
       Tableau de mise en page (2 cellules + 1 entretoise) au lieu de divs flottantes, pour la
       même raison que .parties-row : ça évite que les deux blocs se retrouvent l'un sous l'autre
       quand ils tombent près d'un saut de page. -- */
    .info-cards { width:100%; margin-top:18px; border-collapse:separate; border-spacing:0; page-break-inside: avoid; }
    .info-cards td.info-cards-cell { width:48%; vertical-align:top; }
    .info-cards td.info-cards-spacer { width:4%; }
    .info-card { border:1px solid #c9dcf5; border-radius:6px;
        padding:10px 12px; box-sizing:border-box; font-size:11.5px; line-height:1.7; }
    .info-card .info-card-title { font-weight:800; color:#154c96; font-size:11.5px; text-transform:uppercase;
        margin-bottom:8px; padding-bottom:6px; border-bottom:1px dotted #9fb8de; letter-spacing:0.5px; }
    .info-card .info-card-badge { display:inline-block; width:16px; height:16px; line-height:16px; border-radius:50%;
        background:#154c96; color:#fff; text-align:center; font-size:10px; margin-right:6px; vertical-align:middle; }
    .info-card .info-card-name { font-weight:800; color:#123a73; font-size:12.5px; }

    /* -- Signatures : un seul encadré divisé en 3 zones, cachet au centre (façon modèle).
       Tableau (comme .total-banner, déjà éprouvé) au lieu de divs flottantes : un tableau bascule
       intégralement à la page suivante s'il ne tient pas, au lieu d'être coupé au milieu. -- */
    .signatures-heading { text-align:center; font-weight:800; color:#154c96; letter-spacing:1px;
        text-transform:uppercase; font-size:12.5px; margin-top:30px; padding-bottom:6px; border-bottom:1px solid #c9dcf5; }
    .sign-row { width:100%; margin-top:14px; border:1px solid #c9dcf5; border-radius:6px;
        border-collapse:collapse; overflow:hidden; page-break-inside: avoid; }
    .sign-row td { padding:16px 14px 22px; box-sizing:border-box; vertical-align:top; font-size:12px; }
    .sign-col.right-col { text-align:right; border-left:1px solid #dce7f7; }
    .sign-stamp-col { width:24%; text-align:center; padding:16px 6px; }
    .sign-stamp-col .stamp-circle { display:inline-block; width:70px; height:70px; border-radius:50%;
        border:2px solid #154c96; margin-top:10px; }
    .sign-label { font-weight:700; color:#154c96; margin-bottom:10px; }

    /* -- Bandeau de remerciement -- */
    .thanks-banner { width:100%; background:#154c96; color:#fff; text-align:center; font-style:italic;
        font-weight:700; padding:9px; margin-top:26px; border-radius:4px; font-size:12px; box-sizing:border-box; }
</style>
</th:block>
</head>
<body></body>
</html>
