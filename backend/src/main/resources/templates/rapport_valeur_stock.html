<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Rapport Valeur du stock</title>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; color: #2b2b2b; margin: 16px; }
        .header { width: 100%; height: 100px; margin-bottom: 8px; border: none; padding: 0; box-sizing: border-box; position: relative; }
        .header.bg-logo { background-size: cover; background-position: center; background-repeat: no-repeat; }
        .no-logo-info { display:block; text-align:center; height: 100%; font-size: 16px; font-weight: bold; color: #2b2b2b; line-height: 1.5; background:#f6f6f6; padding: 14px; box-sizing:border-box; }
        .footer-info { width:100%; overflow:hidden; margin-bottom: 16px; }
        .boutique-info { float:left; width:50%; font-size: 12px; line-height:1.4; }
        .meta-info { float:right; width:48%; text-align: right; font-size: 12px; line-height:1.4; }
        .title { text-align:center; font-size: 20px; font-weight: 800; padding: 8px; color: #222; }
        table{border-collapse:collapse;width:100%; margin-top: 16px; font-size: 12px}
        th,td{border-bottom:1px solid #ddd;padding:8px 10px}
        th{background:#fafafa;font-weight:700;text-transform:uppercase}
        .right{ text-align:right }
        .total-row{font-weight:700}
        footer{margin-top:20px;font-size:11px;color:#666;text-align:center}
    </style>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'"></div>
<div th:if="${logoBase64 == null}" class="header"><div class="no-logo-info"><strong th:text="${boutiqueNom}"></strong></div></div>
<div class="footer-info">
    <div th:if="${logoBase64 == null}" class="boutique-info">
        <div><strong th:text="${boutiqueNom}"></strong></div>
        <div><span th:text="${boutiqueTelephone}"></span></div>
        <div><span th:text="${boutiqueAdresse}"></span></div>
    </div>
    <div class="meta-info">
        <div class="meta">Généré le: <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span></div>
    </div>
</div>
<div class="title">Rapport Valeur du stock</div>

<table>
    <thead>
      <tr><th>Produit</th><th class="right">Quantité</th><th class="right">Prix unitaire</th><th class="right">Valeur</th></tr>
    </thead>
    <tbody>
      <tr th:each="row : ${data.details}">
        <td th:text="${row.produitName}"></td>
        <td class="right" th:text="${row.quantiteDisponible}"></td>
        <td class="right" th:text="${row.costAverage != null ? #numbers.formatDecimal(row.costAverage,0,'POINT',0,'NONE') : (row.lastPurchasePrice != null ? #numbers.formatDecimal(row.lastPurchasePrice,0,'POINT',0,'NONE') : '0')} + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA')"></td>
        <td class="right" th:text="${#numbers.formatDecimal((row.costAverage != null ? row.costAverage : row.lastPurchasePrice) * (row.quantiteDisponible != null ? row.quantiteDisponible : 0), 0, 'POINT', 0, 'NONE')} + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA')"></td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3" class="right total-row">VALEUR TOTALE</td>
        <td class="right total-row" th:text="${data.valeurTotale != null ? #numbers.formatDecimal(data.valeurTotale,0,'POINT',0,'NONE') : '0'} + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA')"></td>
      </tr>
    </tfoot>
</table>
<footer>Valeur du stock</footer>
      <!-- CACHET_SIGNATURE_FOOTER -->
      <div th:if="${cachetBase64 != null or signatureBase64 != null}" style="margin-top:24px;width:100%;">
        <table style="width:100%;border-collapse:collapse;">
          <tr>
            <td style="width:50%;text-align:center;vertical-align:bottom;padding:6px;">
              <div th:if="${cachetBase64 != null}"><img th:src="${cachetBase64}" style="max-height:90px;max-width:220px;" /></div>
              <div th:if="${cachetBase64 != null}" style="font-size:11px;color:#555;margin-top:4px;">Cachet</div>
            </td>
            <td style="width:50%;text-align:center;vertical-align:bottom;padding:6px;">
              <div th:if="${signatureBase64 != null}"><img th:src="${signatureBase64}" style="max-height:90px;max-width:220px;" /></div>
              <div th:if="${signatureBase64 != null}" style="font-size:11px;color:#555;margin-top:4px;">Signature</div>
            </td>
          </tr>
        </table>
      </div>
</body>
</html>
