<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bon de Dépense</title>
  <style>
    body { font-family: 'Helvetica', Arial, sans-serif; color: #2b2b2b; margin: 16px; }
    .header { width: 100%; height: 160px; margin-bottom: 12px; }
        .logo { display:block; width:100%; max-height: 150px; height:auto; }
    .header.bg-logo { background-size: cover; background-position:center; background-repeat:no-repeat; }
    .no-logo-info { display:block; text-align:left; font-size: 14px; color: #2b2b2b; line-height: 1.4; }
    .meta-info { width:100%; margin-bottom:12px; font-size: 12px; }
    .title { text-align:center; font-size: 20px; font-weight: 800; padding: 8px; color: #222; }
    .box { border:1px solid #eee; padding:10px; margin-bottom:8px; }
    .right { text-align:right; }
    footer { margin-top: 20px; font-size: 11px; color: #666; text-align: center; }
  </style>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'"></div>
<div th:if="${logoBase64 == null}" class="header">
  <div class="no-logo-info">
    <div><strong th:text="${''}"></strong></div>
  </div>
</div>
<div class="meta-info">
  <div style="float:left; width:60%;">
    <div><strong>Réf:</strong> <span th:text="${depense.reference}"></span></div>
    <div><strong>Libellé:</strong> <span th:text="${depense.libelle}"></span></div>
    <div><strong>Note:</strong> <span th:text="${depense.note}"></span></div>
  </div>
  <div style="float:right; width:38%; text-align:right;">
    <div><strong>Montant:</strong> <span th:text="${#numbers.formatInteger(depense.montant != null ? depense.montant : 0, 0)} + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA')"></span></div>
    <div><strong>Date:</strong> <span th:text="${dateCreatedFormatted}"></span></div>
    <div><strong>Référence caisse:</strong> <span th:text="${depense.referenceCaisse}"></span></div>
  </div>
  <div style="clear:both"></div>
</div>
<div class="title">BON DE DÉPENSE</div>

<div class="box">
  <div><strong>Créée par:</strong> <span th:text="${createurNom != null and createurNom != '' ? createurNom : (depense.createurId != null ? '#'+depense.createurId : '-')}"></span></div>
  <div th:if="${validatorNom != null and validatorNom != ''}"><strong>Validée par:</strong> <span th:text="${validatorNom}"></span> — <span th:text="${validatedAtFormatted}"></span></div>
  <div th:if="${annuleParNom != null and annuleParNom != ''}"><strong>Annulée par:</strong> <span th:text="${annuleParNom}"></span> — <span th:text="${annuleAtFormatted}"></span> — <span th:text="${annuleReason}"></span></div>
</div>

<footer th:text="${boutiqueNom != null and boutiqueNom != '' ? boutiqueNom : 'SMBOUTIQUE'}"></footer>
</body>
</html>
