<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bon de Dépense</title>
  <th:block th:replace="fragments/receipt_style :: styles"></th:block>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'"></div>
<div th:if="${logoBase64 == null}" class="header">
  <div class="no-logo-info">
    <div><strong th:text="${boutiqueNom}"></strong></div>
    <div><span th:text="${boutiqueTelephone}"></span></div>
    <div><span th:text="${boutiqueAdresse}"></span></div>
  </div>
</div>

<div class="doc-title-wrap">
    <span class="title-line"></span><span class="title-dot"></span>
    <span class="doc-title-text" th:text="${docTitle != null ? docTitle : 'BON DE DÉPENSE'}">BON DE DÉPENSE</span>
    <span class="title-dot"></span><span class="title-line"></span>
</div>

<table class="parties-row">
    <tr>
    <td class="party-box">
        <span class="party-label">Boutique : </span>
        <span class="party-name" th:text="${boutiqueNom}"></span>
    </td>
    <td class="party-box">
        <span class="party-label">Créée par : </span>
        <span class="party-name" th:text="${createurNom != null and createurNom != '' ? createurNom : (depense.createurId != null ? '#'+depense.createurId : '-')}"></span>
    </td>
    <td class="party-box">
        <span class="party-label">Réf : </span><span th:text="${depense.reference}"></span><br/>
        <span class="party-label">Date : </span><span th:text="${dateCreatedFormatted}"></span>
    </td>
    </tr>
</table>

<table class="doc-table">
    <colgroup>
        <col style="width:60%" /><col style="width:40%" />
    </colgroup>
    <thead>
    <tr>
        <th class="left">Libellé</th>
        <th>Montant</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td class="left" th:text="${depense.libelle}"></td>
        <td th:text="${montantLabel}"></td>
    </tr>
    </tbody>
</table>

<table class="total-banner">
    <tr>
        <td class="tb-accent"><div class="tb-cart"><div class="tb-cart-basket"><span class="tb-cart-wheel left"></span><span class="tb-cart-wheel right"></span></div></div></td>
        <td class="tb-label">Montant :</td>
        <td class="tb-value" th:text="${montantLabel}"></td>
    </tr>
</table>

<table class="info-cards">
    <tr>
    <td class="info-cards-cell">
        <div class="info-card">
            <div class="info-card-title"><span class="info-card-badge">N</span>Note</div>
            <div th:text="${depense.note}"></div>
        </div>
    </td>
    <td class="info-cards-spacer"></td>
    <td class="info-cards-cell">
        <div class="info-card">
            <div class="info-card-title"><span class="info-card-badge">S</span>Suivi</div>
            <div>Réf. caisse : <span th:text="${depense.referenceCaisse}"></span></div>
            <div th:if="${validatorNom != null and validatorNom != ''}">Validée par <span th:text="${validatorNom}"></span> — <span th:text="${validatedAtFormatted}"></span></div>
            <div th:if="${annuleParNom != null and annuleParNom != ''}">Annulée par <span th:text="${annuleParNom}"></span> — <span th:text="${annuleAtFormatted}"></span> — <span th:text="${annuleReason}"></span></div>
        </div>
    </td>
    </tr>
</table>

<div class="signatures-heading">Signature</div>
<table class="sign-row">
    <tr>
    <td class="sign-col">
        <div class="sign-label">Signature :</div>
        <span th:if="${signatureBase64 != null}"><img th:src="${signatureBase64}" style="height:48px;" /></span>
        <span th:if="${signatureBase64 == null}">__________________________</span>
    </td>
    <td class="sign-stamp-col">
        <img th:if="${cachetBase64 != null}" th:src="${cachetBase64}" style="height:72px;max-width:140px;" />
        <span th:if="${cachetBase64 == null}" class="stamp-circle"></span>
    </td>
    <td class="sign-col right-col"></td>
    </tr>
</table>

<div class="thanks-banner">La satisfaction de nos clients, notre priorité !</div>
</body>
</html>
