<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bon de Réception</title>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; color: #2b2b2b; margin: 16px; }
        /* Header without visible border; fill with background-image when logo present */
        .header { width: 100%; height: 120px; margin-bottom: 8px; border: none; padding: 0; box-sizing: border-box; position:relative; }
        .header.bg-logo { background-size: cover; background-position:center; background-repeat:no-repeat; }
        .logo { display:block; width:100%; max-height: 110px; height:auto; }
        .no-logo-info { display:block; text-align:center; height: 100%; font-size: 16px; font-weight: bold; color: #2b2b2b; line-height: 1.5; background:#f6f6f6; padding:14px; box-sizing:border-box; }
        .footer-info { width:100%; overflow:hidden; margin-bottom: 12px; }
        .boutique-info { float:left; width:50%; font-size: 12px; line-height:1.4; }
        .meta-info { float:right; width:48%; text-align:right; font-size: 12px; line-height:1.4; }
        /* Table grid: full borders and centered content */
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .table th, .table td { border: 1px solid #ddd; padding: 6px 8px; text-align:center; vertical-align: middle; }
        .table .right { text-align:center; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .meta { margin-bottom: 4px; }
        .title { text-align:center; font-size: 20px; font-weight: 800; padding: 8px; color: #222; }
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .table th, .table td { border-bottom: 1px solid #ddd; padding: 8px 10px; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .table tbody tr:nth-child(even) { background: #fbfbfb; }
        .right { text-align:right; }
        .signature { margin-top: 28px; font-size: 12px; }
        footer { margin-top: 20px; font-size: 11px; color: #666; text-align: center; }
    </style>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'">
    <!-- background fills the header area -->
</div>
<div th:if="${logoBase64 == null}" class="header">
    <div class="no-logo-info">
        <div><strong th:text="${boutiqueNom}"></strong></div>
        <div><span th:text="${boutiqueTelephone}"></span></div>
        <div><span th:text="${boutiqueAdresse}"></span></div>
    </div>
</div>
<div class="footer-info">
    <div th:if="${logoBase64 == null}" class="boutique-info">
        <div><strong th:text="${boutiqueNom}"></strong></div>
        <div><span th:text="${boutiqueTelephone}"></span></div>
        <div><span th:text="${boutiqueAdresse}"></span></div>
    </div>
    <div class="meta-info">
        <div class="meta">Réf: <span th:text="${reception.reference}"></span></div>
        <div class="meta">Date: <span th:text="${dateReceptionFormatted}"></span></div>
        <div class="meta">Commande: <span th:text="${reception.commandeFournisseur != null ? reception.commandeFournisseur.reference : ''}"></span></div>
    </div>
</div>

<!-- Boxed reception number like PHP -->
<div style="text-align:center;margin-top:8px;">
    <div style="display:inline-block;border:1px solid #2b2b2b;padding:6px 8px;font-weight:700;">BON DE RECEPTION N : <span th:text="${reception.reference}"></span></div>
</div>

<div style="text-align:center;margin-top:6px;font-weight:700;">FOURNISSEUR: <span th:text="${reception.commandeFournisseur != null and reception.commandeFournisseur.fournisseur != null ? reception.commandeFournisseur.fournisseur.nom + ' ' + reception.commandeFournisseur.fournisseur.prenom : ''}"></span>   RECU le: <span th:text="${dateReceptionFormatted}"></span></div>
<div class="title" style="margin-top:6px;"> </div>

<table class="table">
    <colgroup>
        <col style="width:50%" />
        <col style="width:16%" />
        <col style="width:17%" />
        <col style="width:17%" />
    </colgroup>
    <thead>
    <tr>
        <th>Désignation</th>
        <th class="right">Qté Commande</th>
        <th class="right">Qté Reçue</th>
        <th class="right">Qté Restante</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="lc : ${receptionLignes}">
        <td>
            <span th:with="designation=${lc.stock != null and lc.stock.produit != null ? lc.stock.produit.nomProduit : (lc.designation != null ? lc.designation : 'Produit')}, 
                            nombreUnites=${lc.stock != null and lc.stock.produit != null ? lc.stock.produit.nombreUnitesParConditionnement : null},
                            uniteLib=${lc.stock != null and lc.stock.produit != null and lc.stock.produit.unite != null ? lc.stock.produit.unite.libelle : 'carton'}">
                <span th:if="${lc.quantiteConditionnement != null}">
                    <span th:text="${#numbers.formatInteger(lc.quantiteConditionnement,0)}">0</span>
                    <span th:text="${uniteLib}">carton</span>
                    <span> de </span>
                    <span th:text="${designation}"></span>
                    <br/>
                    <small>(# <span th:text="${#numbers.formatInteger(lc.quantite,0)}">0</span> u — 1 <span th:text="${uniteLib}">carton</span> = <span th:text="${nombreUnites != null ? nombreUnites : 0}">0</span> u )</small>
                </span>
                <span th:unless="${lc.quantiteConditionnement != null}">
                    <span th:if="${nombreUnites != null and nombreUnites > 1 and lc.quantite != null and lc.quantite % nombreUnites == 0}">
                        <span th:text="${lc.quantite / nombreUnites}"></span>
                        <span th:text="${uniteLib}"></span>
                        <span> de </span>
                        <span th:text="${designation}"></span>
                        <br/>
                        <small>(# <span th:text="${#numbers.formatInteger(lc.quantite,0)}">0</span> u — 1 <span th:text="${uniteLib}">carton</span> = <span th:text="${nombreUnites}">0</span> u )</small>
                    </span>
                    <span th:unless="${nombreUnites != null and nombreUnites > 1 and lc.quantite != null and lc.quantite % nombreUnites == 0}" th:text="|${#numbers.formatInteger(lc.quantite, 0)} ${uniteLib}|"></span>
                </span>
            </span>
        </td>
        <td class="right">
            <span th:if="${lc.quantiteConditionnement != null}">
                <span th:text="${#numbers.formatInteger(lc.quantiteConditionnement,0)}"></span> <span th:text="${lc.stock != null and lc.stock.produit != null and lc.stock.produit.unite != null ? lc.stock.produit.unite.libelle : 'carton'}"></span>
            </span>
            <span th:unless="${lc.quantiteConditionnement != null}">
                <span th:if="${lc.stock != null and lc.stock.produit != null and lc.stock.produit.nombreUnitesParConditionnement != null and lc.quantite != null and lc.quantite % lc.stock.produit.nombreUnitesParConditionnement == 0}">
                    <span th:text="${lc.quantite / lc.stock.produit.nombreUnitesParConditionnement}"></span> <span th:text="${lc.stock.produit.unite.libelle}"></span>
                </span>
                <span th:unless="${lc.stock != null and lc.stock.produit != null and lc.stock.produit.nombreUnitesParConditionnement != null and lc.quantite != null and lc.quantite % lc.stock.produit.nombreUnitesParConditionnement == 0}" th:text="${#numbers.formatInteger(lc.quantite, 0)}">0</span>
            </span>
        </td>
        <td class="right">
            <!-- Find corresponding view entry for this lc to get qteRecueThis -->
            <span th:each="v : ${lignesView}" th:if="${v.designation == (lc.stock != null and lc.stock.produit != null ? lc.stock.produit.nomProduit : (lc.designation != null ? lc.designation : 'Produit'))}">
                <span th:if="${(lc.stock != null and lc.stock.produit != null and lc.stock.produit.nombreUnitesParConditionnement != null) and (v.qteRecueThis % lc.stock.produit.nombreUnitesParConditionnement == 0)}">
                    <span th:text="${v.qteRecueThis / lc.stock.produit.nombreUnitesParConditionnement}"></span> <span th:text="${lc.stock.produit.unite.libelle}"></span>
                    <br/><small>(≈ <span th:text="${v.qteRecueThis}"></span> u)</small>
                </span>
                <span th:unless="${(lc.stock != null and lc.stock.produit != null and lc.stock.produit.nombreUnitesParConditionnement != null) and (v.qteRecueThis % lc.stock.produit.nombreUnitesParConditionnement == 0)}" th:text="${v.qteRecueThis}"></span>
            </span>
        </td>
        <td class="right">
            <!-- Remaining: prefer carton display if divisible -->
            <span th:each="v : ${lignesView}" th:if="${v.designation == (lc.stock != null and lc.stock.produit != null ? lc.stock.produit.nomProduit : (lc.designation != null ? lc.designation : 'Produit'))}">
                <span th:if="${(lc.stock != null and lc.stock.produit != null and lc.stock.produit.nombreUnitesParConditionnement != null) and (v.qteRestante % lc.stock.produit.nombreUnitesParConditionnement == 0)}">
                    <span th:text="${v.qteRestante / lc.stock.produit.nombreUnitesParConditionnement}"></span> <span th:text="${lc.stock.produit.unite.libelle}"></span>
                </span>
                <span th:unless="${(lc.stock != null and lc.stock.produit != null and lc.stock.produit.nombreUnitesParConditionnement != null) and (v.qteRestante % lc.stock.produit.nombreUnitesParConditionnement == 0)}" th:text="${v.qteRestante}"></span>
            </span>
        </td>
    </tr>
    </tbody>
</table> 

<div class="signature">Signature: __________________________</div>

<footer th:text="${boutiqueNom != null and boutiqueNom != '' ? boutiqueNom : 'SMBOUTIQUE'}"></footer>
</body>
</html>
