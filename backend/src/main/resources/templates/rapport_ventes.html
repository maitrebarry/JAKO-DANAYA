<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Rapport Ventes</title>
    <th:block th:replace="fragments/receipt_style :: styles"></th:block>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'"></div>
<div th:if="${logoBase64 == null}" class="header"><div class="no-logo-info"><strong th:text="${boutiqueNom}"></strong></div></div>

<div class="doc-title-wrap">
    <span class="title-line"></span><span class="title-dot"></span>
    <span class="doc-title-text">RAPPORT DES VENTES</span>
    <span class="title-dot"></span><span class="title-line"></span>
</div>

<table class="parties-row">
    <tr>
    <td class="party-box">
        <span class="party-label">Boutique : </span>
        <span class="party-name" th:text="${boutiqueNom}"></span>
    </td>
    <td class="party-box">
        <span class="party-label">Période : </span>
        <span th:text="${from}"></span> au <span th:text="${to}"></span>
    </td>
    <td class="party-box">
        <span class="party-label">Généré le : </span>
        <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
    </td>
    </tr>
</table>

<table class="doc-table">
    <colgroup>
        <col class="num-col" /><col /><col /><col />
    </colgroup>
    <thead>
      <tr><th>N°</th><th class="left">Date</th><th>Nombre ventes</th><th>Montant total</th></tr>
    </thead>
    <tbody>
      <tr th:each="row, rowStat : ${data}">
        <td th:text="${rowStat.count}"></td>
        <td class="left" th:text="${row.date}"></td>
        <td th:text="${row.nombreVentes}"></td>
        <td th:text="${#numbers.formatInteger(row.montantTotal,0) + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA')}"></td>
      </tr>
    </tbody>
</table>

<table class="total-banner">
    <tr>
        <td class="tb-accent"><div class="tb-cart"></div></td>
        <td class="tb-label">Total :</td>
        <td class="tb-value" th:text="${#numbers.formatInteger(totalMontant != null ? totalMontant : 0, 0) + ' ' + (deviseSymbole != null ? deviseSymbole : 'FCFA')}"></td>
    </tr>
</table>

<div class="signatures-heading">Signature</div>
<table class="sign-row">
    <tr>
    <td class="sign-col">
        <div class="sign-label">Signature :</div>
        <span th:if="${signatureBase64 != null}"><img th:src="${signatureBase64}" style="height:48px;" /></span>
        <span th:if="${signatureBase64 == null}">__________________________</span>
    </td>
    <td class="sign-stamp-col">
        <img th:if="${cachetBase64 != null}" th:src="${cachetBase64}" style="height:72px;max-width:140px;" />
        <span th:if="${cachetBase64 == null}" class="stamp-circle"></span>
    </td>
    <td class="sign-col right-col"></td>
    </tr>
</table>

<div class="thanks-banner">La satisfaction de nos clients, notre priorité !</div>
</body>
</html>
