# ================= APPLICATION =================
spring.application.name=smboutique-backend
server.port=${PORT:8085}

# ================= JWT =================
#jwt.secret=votreSecretSuperSecureTresLongAuMoins256BitsChangezEnProduction
jwt.secret=${JWT_SECRET:dev-secret-only}
jwt.expiration=86400000

# ================= DATABASE =================

# === PostgreSQL LOCAL (ACTIF) ===
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/db_smboutique_v2
spring.datasource.username=smboutique
spring.datasource.password=smbpass
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚠️ Hibernate 6 détecte le dialecte automatiquement → NE PAS forcer
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === PostgreSQL RENDER (DESACTIVE EN LOCAL) ===
# ⚠️ À activer UNIQUEMENT en production (Render)
# spring.datasource.url=${DATABASE_URL}

# === MySQL (DESACTIVE – prêt pour plus tard) ===
# spring.datasource.url=jdbc:mysql://localhost:3306/db_smboutique_v2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
