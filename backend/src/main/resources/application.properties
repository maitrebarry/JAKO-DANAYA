# pour le deploiement sur render.com et heroku
# ================= APPLICATION =================
spring.application.name=smboutique-backend
server.port=${PORT:8085}
spring.profiles.default=local

# ================= JWT =================
jwt.secret=${JWT_SECRET:dev-secret}
jwt.expiration=86400000

# ================= JPA =================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ================= JACKSON =================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Dakar

# ================= LOGGING =================
logging.level.root=INFO
logging.level.org.springframework.security=INFO

# ================= FILE UPLOAD =================
app.upload.dir=./uploads/
app.upload.user-photo-dir=${app.upload.dir}user_photo/
app.upload.model-photo-dir=${app.upload.dir}model_photo/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================= MAIL =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================= APP FLAGS =================
app.reset-db=false

# ================= OAUTH2 (Google) =================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${APP_OAUTH2_REDIRECT_URI}

# OU utilisez le format par défaut Spring :
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Frontend base URL (local/prod)
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Frontend redirect after OAuth2 login success
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI:${app.frontend.base-url}/oauth2/redirect}
app.oauth2.default-role=${APP_OAUTH2_DEFAULT_ROLE:MANAGER}

# Frontend reset password page
app.frontend.reset-password-url=${APP_RESET_PASSWORD_URL:${app.frontend.base-url}/reset-password}
