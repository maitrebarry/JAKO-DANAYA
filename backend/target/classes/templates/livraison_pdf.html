<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bon de Livraison</title>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; color: #2b2b2b; margin: 16px; }
        .header { width: 100%; height: 120px; margin-bottom: 8px; border: none; padding: 0; box-sizing: border-box; position:relative; }
        .header.bg-logo { background-size: cover; background-position:center; background-repeat:no-repeat; }
        .logo { display:block; width:100%; max-height: 110px; height:auto; }
        .no-logo-info { display:block; text-align:center; height: 100%; font-size: 16px; font-weight: bold; color: #2b2b2b; line-height: 1.5; background:#f6f6f6; padding:14px; box-sizing:border-box; }
        .footer-info { width:100%; overflow:hidden; margin-bottom: 12px; }
        .boutique-info { float:left; width:50%; font-size: 12px; line-height:1.4; }
        .meta-info { float:right; width:48%; text-align:right; font-size: 12px; line-height:1.4; }
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .table th, .table td { border: 1px solid #ddd; padding: 6px 8px; text-align:center; vertical-align: middle; }
        .table .right { text-align:center; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .meta { margin-bottom: 4px; }
        .title { text-align:center; font-size: 20px; font-weight: 800; padding: 8px; color: #222; }
        .table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .table th, .table td { border-bottom: 1px solid #ddd; padding: 8px 10px; }
        .table th { background: #fafafa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .table tbody tr:nth-child(even) { background: #fbfbfb; }
        .right { text-align:right; }
        .signature { margin-top: 28px; font-size: 12px; }
        footer { margin-top: 20px; font-size: 11px; color: #666; text-align: center; }
    </style>
</head>
<body>
<div th:if="${logoBase64 != null}" class="header bg-logo" th:style="'background-image: url(' + ${logoBase64} + ');'">
    <!-- background fills the header area -->
</div>
<div th:if="${logoBase64 == null}" class="header">
    <div class="no-logo-info">
        <div><strong th:text="${livraison.commandeClient != null && livraison.commandeClient.boutique != null ? livraison.commandeClient.boutique.nom : ''}"></strong></div>
        <div><span th:text="${livraison.commandeClient != null && livraison.commandeClient.boutique != null ? livraison.commandeClient.boutique.telephone : ''}"></span></div>
        <div><span th:text="${livraison.commandeClient != null && livraison.commandeClient.boutique != null ? livraison.commandeClient.boutique.adresse : ''}"></span></div>
    </div>
</div>
<div class="footer-info">
    <div th:if="${logoBase64 == null}" class="boutique-info">
        <div><strong th:text="${livraison.commandeClient != null && livraison.commandeClient.boutique != null ? livraison.commandeClient.boutique.nom : ''}"></strong></div>
        <div><span th:text="${livraison.commandeClient != null && livraison.commandeClient.boutique != null ? livraison.commandeClient.boutique.telephone : ''}"></span></div>
        <div><span th:text="${livraison.commandeClient != null && livraison.commandeClient.boutique != null ? livraison.commandeClient.boutique.adresse : ''}"></span></div>
    </div>
    <div class="meta-info">
        <div class="meta">Réf: <span th:text="${livraison.reference}"></span></div>
        <div class="meta">Date: <span th:text="${dateLivraisonFormatted}"></span></div>
        <div class="meta">Commande: <span th:text="${livraison.commandeClient != null ? livraison.commandeClient.reference : ''}"></span></div>
    </div>
</div>

<!-- Boxed livraison number like reception -->
<div style="text-align:center;margin-top:8px;">
    <div style="display:inline-block;border:1px solid #2b2b2b;padding:6px 8px;font-weight:700;">BON DE LIVRAISON N : <span th:text="${livraison.reference}"></span></div>
</div>

<div style="text-align:center;margin-top:6px;font-weight:700;">CLIENT: <span th:text="${livraison.commandeClient != null && livraison.commandeClient.client != null ? livraison.commandeClient.client.nom + ' ' + livraison.commandeClient.client.prenom : ''}"></span>   LIVRÉ le: <span th:text="${dateLivraisonFormatted}"></span></div>
<div class="title" style="margin-top:6px;"> </div>

<table class="table">
    <colgroup>
        <col style="width:50%" />
        <col style="width:16%" />
        <col style="width:17%" />
        <col style="width:17%" />
    </colgroup>
    <thead>
    <tr>
        <th>Désignation</th>
        <th class="right">Qté Commande</th>
        <th class="right">Qté Livrée</th>
        <th class="right">Qté Restante</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ligne : ${lignesView}">
        <td>
            <span th:if="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}">
                <span th:text="${#numbers.formatInteger(ligne.quantiteConditionnement,0)}">0</span>
                <span th:text="${ligne.uniteLibelle != null ? ligne.uniteLibelle : (ligne.stock != null && ligne.stock.produit != null && ligne.stock.produit.unite != null ? ligne.stock.produit.unite.libelle : 'carton')}">carton</span>
                <span> de </span>
                <span th:text="${ligne.designation != null ? ligne.designation : (ligne.stock != null && ligne.stock.produit != null ? ligne.stock.produit.nomProduit : 'Produit')}"></span>
            </span>
            <span th:unless="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}"
                  th:text="${ligne.designation != null ? (ligne.designation + (ligne.stock != null && ligne.stock.produit != null && ligne.stock.produit.unite != null ? ' (' + ligne.stock.produit.unite.libelle + ')' : '')) : (ligne.stock != null && ligne.stock.produit != null ? (ligne.stock.produit.nomProduit + (ligne.stock.produit.unite != null ? ' (' + ligne.stock.produit.unite.libelle + ')' : '')) : 'Produit')}"></span>
        </td>
        <td class="right">
            <span th:if="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}" th:text="|${#numbers.formatInteger(ligne.quantiteConditionnement,0)} ${ligne.stock != null && ligne.stock.produit != null && ligne.stock.produit.unite != null ? ligne.stock.produit.unite.libelle : 'carton'}|"></span>
            <span th:if="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}">
                <br/>
                <small>(≈ <span th:text="${#numbers.formatInteger(ligne.qteCommande,0)}">0</span> u
                    <span th:if="${ligne.stock != null and ligne.stock.produit != null and ligne.stock.produit.nombreUnitesParConditionnement != null}"> — 1 <span th:text="${ligne.uniteLibelle != null ? ligne.uniteLibelle : (ligne.stock != null && ligne.stock.produit != null && ligne.stock.produit.unite != null ? ligne.stock.produit.unite.libelle : 'carton')}">carton</span> = <span th:text="${ligne.stock.produit.nombreUnitesParConditionnement}">0</span> u</span>
                 )</small>
            </span>
            <span th:unless="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}" th:text="${ligne.qteCommandeLabel}">0</span>
        </td>
        <td class="right">
            <span th:if="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}" th:text="|${#numbers.formatInteger(ligne.quantiteConditionnement,0)} ${ligne.stock != null && ligne.stock.produit != null && ligne.stock.produit.unite != null ? ligne.stock.produit.unite.libelle : 'carton'}|"></span>
            <span th:if="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}">
                <br/>
                <small>(≈ <span th:text="${#numbers.formatInteger(ligne.qteLivreeThis != null ? ligne.qteLivreeThis : (ligne.quantite != null ? ligne.quantite : 0),0)}">0</span> u
                    <span th:if="${ligne.stock != null and ligne.stock.produit != null and ligne.stock.produit.nombreUnitesParConditionnement != null}"> — 1 cond = <span th:text="${ligne.stock.produit.nombreUnitesParConditionnement}">0</span> u</span>
                 )</small>
            </span>
            <span th:unless="${ligne.quantiteConditionnement != null and ligne.quantiteConditionnement > 0}" th:text="${ligne.qteLivreeLabel}">0</span>
        </td>
        <td class="right" th:text="${#numbers.formatInteger(ligne.qteRestante != null ? ligne.qteRestante : 0, 0)}"></td>
    </tr>
    </tbody>
</table> 

<div class="signature">Signature: __________________________</div>
<footer>SMBOUTIQUE</footer>
</body>
</html>
